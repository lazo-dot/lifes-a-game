<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Life's a Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Life's a Game · Oberfläche
   Layout: Hof in Draufsicht links mit Charakter und Fähigkeiten, holzgerahmte Schiefer-Panels rechts.
   Bewusst nur ein Farbschema (eine dunkle Spielwelt). */
:root{
  --bg-a:#0d1719; --bg-b:#14231f; --bg-check:#16262a; --edge:#0a1013;
  --panel-dk:#141f24; --panel:#1b2a2f; --panel-2:#24373a; --panel-3:#3a5450; --panel-in:#121d21;
  --wood:#d4a25a; --wood-lt:#f4d58e; --wood-dk:#76502a;
  --text:#f1e9d6; --text-soft:#9fb4ad; --ink-dk:#2a1708;
  --leaf:#7fcf8a; --leaf-dk:#367a4c; --leaf-hi:#c8f2cc;
  --water:#6fa8d0; --water-dk:#2f4f6e; --red:#e8604f; --rare:#c99cf2; --repair:#e0a85a; --rain:#5a7ea8;
  --c0:#1c2a2e; --c1:#2f5a3e; --c2:#3f7f50; --c3:#5aa866; --c4:#8fd88f;
  --dim:rgba(6,10,12,.78);
  --f-display:"Pixelify Sans","Courier New",monospace; --f-body:"VT323","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;color:var(--text);font-family:var(--f-body);font-size:21px;line-height:1.15;background-color:var(--bg-a);
  background-image:linear-gradient(45deg,var(--bg-check) 25%,transparent 25%,transparent 75%,var(--bg-check) 75%),linear-gradient(45deg,var(--bg-check) 25%,transparent 25%,transparent 75%,var(--bg-check) 75%),linear-gradient(180deg,var(--bg-a),var(--bg-b));
  background-size:32px 32px,32px 32px,100% 100%;background-position:0 0,16px 16px,0 0;background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(64px + env(safe-area-inset-bottom,0px))}
canvas,img.pi{image-rendering:pixelated;image-rendering:crisp-edges}
img.pi{display:inline-block;vertical-align:middle;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--wood-lt);outline-offset:2px}
::placeholder{color:var(--text-soft);opacity:.75}

.wrap{max-width:1120px;margin:0 auto;display:grid;gap:18px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.logo{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vw,46px);line-height:1;color:var(--wood-lt);text-shadow:0 3px 0 var(--wood-dk),3px 0 0 var(--edge),-3px 0 0 var(--edge),0 -3px 0 var(--edge),0 6px 0 var(--edge)}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cal{display:flex;align-items:center;gap:8px;font-size:22px}
.cal b{font-family:var(--f-display);font-weight:600;color:var(--wood-lt);font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px;border:2px dashed var(--rare);color:#e6d6fa;font-size:20px}
.demo-bar span{flex:1 1 240px}

.main{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.main{grid-template-columns:minmax(0,480px) minmax(0,1fr);align-items:start}}
.col{display:grid;gap:18px;min-width:0}
.frame{position:relative;padding:18px;border:3px solid var(--edge);color:var(--text);
  background:linear-gradient(var(--wood-lt),var(--wood-lt)) left 6px top 6px/3px 3px no-repeat,linear-gradient(var(--wood-lt),var(--wood-lt)) right 6px top 6px/3px 3px no-repeat,linear-gradient(var(--wood-lt),var(--wood-lt)) left 6px bottom 6px/3px 3px no-repeat,linear-gradient(var(--wood-lt),var(--wood-lt)) right 6px bottom 6px/3px 3px no-repeat,linear-gradient(180deg,var(--panel-2),var(--panel) 55%,var(--panel-dk));
  box-shadow:inset 0 0 0 2px var(--wood),inset 0 0 0 3px var(--wood-dk);
  clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px)}
.plank{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--wood-lt)}
.plank::before{content:"";width:6px;height:6px;background:var(--wood);transform:rotate(45deg);flex:none}
.plank::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--wood-dk),transparent)}

.scene{padding:6px}
.scene canvas{display:block;width:100%;aspect-ratio:16/10;max-width:100%;background:#4a845c}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 6px 2px;font-size:17px;color:var(--text-soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}

.stat-row{display:flex;align-items:center;gap:14px}
.lvl-badge{flex:none;width:72px;height:72px;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at 40% 35%,var(--panel-3),var(--panel-dk) 70%);border:3px solid var(--edge);box-shadow:inset 0 0 0 3px var(--wood),inset 0 0 0 5px var(--wood-dk);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.lvl-badge small{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;line-height:1;color:var(--text-soft)}
.lvl-badge strong{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--wood-lt);text-shadow:0 2px 0 var(--wood-dk)}
.stat-main{flex:1;min-width:0;display:grid;gap:7px}
.stat-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.stat-line .t{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--wood-lt)}
.near{font-size:19px;color:var(--leaf)}
.bar{position:relative;height:18px;background:var(--edge);border:2px solid var(--edge);box-shadow:0 0 0 2px var(--wood-dk);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(to bottom,var(--leaf-hi) 0 25%,var(--leaf) 25% 70%,var(--leaf-dk) 70%);transition:width .5s steps(12)}
.bar.sm{height:12px;box-shadow:0 0 0 1px var(--panel-3)}
.bar.sk>i{background:linear-gradient(to bottom,var(--hi) 0 25%,var(--c) 25% 70%,var(--dk) 70%)}

.skills{display:grid;gap:11px;margin-top:12px}
.skill{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.skill>img,.skill>.iconbtn{grid-row:span 2}
.skill .stat-line{font-size:20px}
.skill .lv{font-family:var(--f-display);font-size:13px;color:var(--text-soft)}
.skill .bar{grid-column:2}
.skill .ren{grid-row:span 2;grid-column:3}
.iconbtn{background:none;border:2px solid transparent;padding:2px 6px;color:var(--text-soft);cursor:pointer;font-family:var(--f-display);font-size:14px}
.iconbtn:hover{color:var(--wood-lt);border-color:var(--panel-3)}

.npc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;width:100%;text-align:left;cursor:pointer;background:var(--panel-in);border:2px solid var(--panel-3);padding:10px;color:var(--text)}
.npc:hover{border-color:var(--wood-dk)}
.portrait{width:56px;height:56px;border:2px solid var(--edge);box-shadow:0 0 0 2px var(--wood);image-rendering:pixelated}
.npc-name{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--wood-lt)}
.npc-text{font-size:21px;margin-top:2px;min-height:2.3em}
.npc-more{font-size:17px;color:var(--text-soft);margin-top:4px}

.panel-wrap{min-width:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;position:relative;z-index:2;margin-bottom:-3px;padding-left:10px}
.tab{font-family:var(--f-display);font-weight:600;font-size:15px;background:var(--panel-dk);color:var(--text-soft);border:3px solid var(--edge);border-bottom:none;padding:8px 12px;cursor:pointer}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--wood-lt);box-shadow:inset 0 2px 0 var(--wood);padding-bottom:11px}
.tab .n{display:inline-block;min-width:1.4em;margin-left:5px;padding:0 4px;background:var(--leaf-dk);color:var(--leaf-hi);font-size:12px;line-height:1.5;text-align:center}
.panel{min-height:460px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.panel h2,.overlay h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:27px;color:var(--wood-lt);text-shadow:0 2px 0 var(--edge);text-wrap:balance}
.panel h3,.overlay h3{margin:4px 0 0;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-soft)}
.sub{margin:-8px 0 0;color:var(--text-soft);font-size:20px;max-width:62ch}
.hint{margin:0;color:var(--text-soft);font-size:19px;max-width:62ch}

.add{display:flex;flex-wrap:wrap;gap:8px}
.add .in{flex:1 1 200px}
.in{background:var(--panel-in);border:2px solid var(--panel-3);box-shadow:inset 2px 2px 0 var(--edge);padding:7px 10px;font-size:21px;min-width:0;color:var(--text)}
.in:focus{border-color:var(--wood);outline:none}
select.in,input[type=date].in,input[type=time].in{flex:0 1 auto;cursor:pointer}
textarea.in{width:100%;min-height:120px;resize:vertical;line-height:1.2}

.btn{font-family:var(--f-display);font-weight:600;font-size:16px;background:var(--wood);color:var(--ink-dk);border:3px solid var(--edge);cursor:pointer;padding:8px 14px;box-shadow:inset -3px -3px 0 var(--wood-dk),inset 3px 3px 0 var(--wood-lt)}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:inset 3px 3px 0 var(--wood-dk)}
.btn.alt{background:var(--panel-3);color:var(--text);box-shadow:inset -3px -3px 0 var(--panel-dk),inset 3px 3px 0 #5a7a74}
.btn.sm{font-size:13px;padding:5px 9px;border-width:2px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--panel-dk);color:var(--text-soft);border:2px solid var(--panel-3);box-shadow:none;font-size:14px;padding:6px 10px}
.btn.ghost[aria-pressed="true"]{color:var(--wood-lt);border-color:var(--wood-dk)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 10px 10px 12px;background:var(--panel-in);border:2px solid var(--panel-3)}
.row.pop{animation:pop .35s steps(4)}
@keyframes pop{40%{transform:scale(1.025)}}
.row-title{font-size:22px;overflow-wrap:anywhere}
.row.done .row-title{color:var(--leaf-hi)}
.row.off{opacity:.62}
.plan{font-size:18px;color:var(--wood-lt)}
.meta{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:3px;font-size:18px;color:var(--text-soft);font-variant-numeric:tabular-nums}
.meta span{display:inline-flex;align-items:center;gap:5px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.chk{width:34px;height:34px;padding:0;border:2px solid var(--edge);background:var(--panel-dk);box-shadow:inset 0 0 0 2px var(--panel-3);cursor:pointer;display:grid;place-items:center}
.chk:hover{box-shadow:inset 0 0 0 2px var(--wood-dk)}
.chk[aria-pressed="true"]{background:var(--leaf);box-shadow:inset -3px -3px 0 var(--leaf-dk),inset 3px 3px 0 var(--leaf-hi)}
.chk.tiny[aria-pressed="true"]{background:var(--water);box-shadow:inset -3px -3px 0 #3a6a90,inset 3px 3px 0 #bfe0f6}
.chk[aria-pressed="true"]::after{content:"";width:18px;height:14px;background:var(--edge);clip-path:polygon(0 43%,22% 43%,22% 64%,33% 64%,33% 79%,44% 79%,44% 64%,56% 64%,56% 43%,67% 43%,67% 21%,78% 21%,78% 0,100% 0,100% 21%,89% 21%,89% 43%,78% 43%,78% 64%,67% 64%,67% 86%,56% 86%,56% 100%,33% 100%,33% 86%,22% 86%,22% 79%,11% 79%,11% 64%,0 64%)}
.minib{font-family:var(--f-display);font-size:13px;padding:3px 7px;background:var(--panel-dk);color:var(--water);border:2px solid var(--water-dk);cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.minib[aria-pressed="true"]{background:var(--water-dk);color:#e6f4ff}
.del{background:none;border:none;padding:4px 6px;font-family:var(--f-display);font-size:18px;color:var(--text-soft);cursor:pointer;line-height:1}
.del:hover{color:var(--red)}
.empty{padding:18px;border:2px dashed var(--panel-3);color:var(--text-soft);text-align:center;font-size:20px}
.tok{display:inline-flex;gap:2px}
.tok i{width:7px;height:9px;background:var(--water);clip-path:polygon(50% 0,100% 60%,80% 100%,20% 100%,0 60%)}
.tok i.e{background:var(--panel-3)}
.repair{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;padding:8px 10px;border:2px dashed var(--water-dk);color:#cfe6f6;font-size:19px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;background:rgba(127,207,138,.1);border:2px solid var(--leaf-dk);color:var(--leaf-hi);font-size:20px}
.banner .sp{flex:1 1 100%}
.banner.info{background:rgba(111,168,208,.1);border-color:var(--water-dk);color:#d6ecfa}
.planned{font-size:17px;color:var(--wood-lt)}

.hform{display:grid;gap:12px;padding:14px;background:var(--panel-in);border:2px solid var(--panel-3)}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;align-items:start}
.step>b{font-family:var(--f-display);font-size:14px;width:26px;height:26px;display:grid;place-items:center;background:var(--wood-dk);color:var(--wood-lt);border:2px solid var(--edge)}
.step label,.step .lab{font-size:20px;color:var(--text)}
.step .ctl{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step .ctl .in{flex:1 1 180px}
.pre{font-size:21px;color:var(--wood-lt)}
.chip{font-family:var(--f-display);font-size:14px;padding:5px 9px;background:var(--panel-dk);color:var(--text-soft);border:2px solid var(--panel-3);cursor:pointer}
.chip[aria-pressed="true"]{color:var(--ink-dk);background:var(--wood);border-color:var(--edge)}
.chip.idea{color:var(--text);text-align:left}
.preview{font-size:21px;color:var(--leaf-hi);padding:8px 10px;border-left:3px solid var(--leaf)}
.err{color:#ffb4a8;font-size:19px}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:19px;color:var(--text-soft)}
.sw input{appearance:none;-webkit-appearance:none;width:34px;height:18px;background:var(--panel-dk);border:2px solid var(--panel-3);position:relative;cursor:pointer;margin:0}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--text-soft)}
.sw input:checked{background:var(--leaf-dk);border-color:var(--leaf)}
.sw input:checked::after{left:18px;background:var(--leaf-hi)}

.hcard{display:grid;gap:8px;padding:12px;background:var(--panel-in);border:2px solid var(--panel-3)}
.hcard.grad{border-color:var(--wood)}
.hcard.paused{opacity:.85;border-style:dashed}
.hcard .hd{display:flex;align-items:center;gap:10px}
.hcard .hd .row-title{flex:1;min-width:0}
.badge{font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:2px solid currentColor;white-space:nowrap}
.badge.gold{color:var(--wood-lt)} .badge.rare{color:var(--rare)} .badge.com{color:var(--text-soft)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-size:19px;margin:0}
.kv dt{color:var(--text-soft)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.toggles{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.suggest{padding:8px 10px;border:2px solid var(--leaf-dk);color:var(--leaf-hi);font-size:19px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.weather{display:flex;gap:6px;flex-wrap:wrap}
.wbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;background:var(--panel-in);border:2px solid var(--panel-3);cursor:pointer;font-size:17px;min-width:70px;color:var(--text)}
.wbtn[aria-pressed="true"]{border-color:var(--wood);box-shadow:inset 0 -3px 0 var(--wood);color:var(--wood-lt)}
.prompt{font-size:20px;color:var(--text-soft)}
.entry{padding:12px;background:var(--panel-in);border:2px solid var(--panel-3);display:grid;gap:6px}
.entry header{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--wood-lt)}
.entry p{margin:0;font-size:21px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:62ch}
.closed{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(127,207,138,.1);border:2px solid var(--leaf-dk);color:var(--leaf-hi);font-size:20px}
.week-review{display:grid;gap:4px;padding:12px;border:2px solid var(--wood-dk);background:rgba(212,162,90,.07);font-size:20px}
.week-review b{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--wood-lt)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.tile{padding:10px 12px;background:var(--panel-in);border:2px solid var(--panel-3);display:grid;gap:2px}
.tile strong{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--wood-lt);font-variant-numeric:tabular-nums}
.tile span{font-size:18px;color:var(--text-soft)}
.spark{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 10px;background:var(--panel-in);border:2px solid var(--panel-3)}
.spark svg{width:100%;height:40px;display:block}
.spark .r{text-align:right;font-size:18px;color:var(--text-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.hall{display:grid;gap:6px}
.hall div{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--wood-dk);background:rgba(212,162,90,.08);font-size:20px}
.data{display:grid;gap:10px}
.data textarea{min-height:100px;font-size:16px}

/* Erntekalender */
.harvest{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:10px;padding:12px;background:var(--panel-in);border:2px solid var(--panel-3)}
.harvest .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cal-scroll{overflow-x:auto;padding-bottom:4px}
.cal-grid{display:grid;grid-template-columns:22px repeat(var(--cols),9px);grid-template-rows:14px repeat(7,9px);gap:2px;width:max-content;font-size:13px;color:var(--text-soft)}
.cal-grid .m{grid-row:1;white-space:nowrap;line-height:14px}
.cal-grid .wd{grid-column:1;line-height:9px;font-size:11px}
.cal-grid i{display:block;width:9px;height:9px}
.v-none,.v-future,.v-before{background:transparent}
.v-future{box-shadow:inset 0 0 0 1px rgba(159,180,173,.12)}
.v-off{background:transparent;box-shadow:inset 0 0 0 1px rgba(159,180,173,.22)}
.v-empty,.v-0{background:var(--c0)}
.v-1{background:var(--c1)} .v-2{background:var(--c2)} .v-3{background:var(--c3)} .v-4{background:var(--c4)}
.v-done{background:var(--leaf)} .v-tiny{background:var(--water)} .v-repaired{background:var(--repair)} .v-watered{background:var(--rain)}
.v-today{outline:2px solid var(--wood-lt);outline-offset:1px}
.v-before{box-shadow:inset 0 0 0 1px rgba(159,180,173,.1)}
h2[tabindex="-1"]:focus{outline:none}
.cal-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:17px;color:var(--text-soft)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:10px;height:10px;display:inline-block}

.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

<script>
/* Life's a Game · Spiellogik
 * UI-frei und ohne DOM: läuft im Browser (window.LAG) und in Node (require) für Tests.
 * Alle Datumswerte sind lokale Tagesschlüssel "YYYY-MM-DD", damit die Logik 1:1 nach Dart portierbar ist.
 * Referenz: Entwicklungsleitfaden v1.2, Abschnitte 3 und 4.
 */
(function (root) {
  'use strict';

  /* ---------- Konstanten (Leitfaden 4) ---------- */
  const C = {
    SCHEMA: 4,
    EMA_A: 0.044,          // 4.2 Stärke pro geplantem Termin
    MAX_TOKENS: 2,         // 4.3 Regentage
    TOKEN_EVERY: 7,        // 4.3 1 Token je 7 erledigte Termine
    REPAIR_DAYS: 2,        // 4.3 Reparatur innerhalb 48 h
    DROP_P: 0.12,          // 4.4 Überraschungsfund
    RARE_P: 0.2,           // 4.4 Anteil seltener Funde
    JOURNAL_XP: 10,        // 5.3 kleine XP 1×/Tag
    MAX_SKILLS: 6,
    MAX_BEDS: 12,
    START_HABITS: 3,       // 5.1 Onboarding max. 3
    UNLOCK_DAYS: 7,        // 5.1 weitere nach der ersten Woche
    GRAD_DAYS: 30,         // 4.5 Graduierung
    SUGGEST_STRENGTH: 0.8, // 4.5 Ausschleichen
    SUGGEST_RUN: 14,
    CHECKIN_UNTIL_HOUR: 14 // 4.6 Morgen-Check-in nur bis zum frühen Nachmittag anbieten
  };
  const STAGES = [[0.15, 'Keim'], [0.35, 'Setzling'], [0.6, 'Jungpflanze'], [0.9, 'Blüte'], [2, 'Ausgewachsen']];
  const ITEMS = {
    flowers: { name: 'Blumenbeet', rare: false }, bench: { name: 'Holzbank', rare: false }, lantern: { name: 'Laterne', rare: false },
    barrel: { name: 'Fass', rare: false }, pot: { name: 'Blumentopf', rare: false }, sign: { name: 'Wegweiser', rare: false }, hay: { name: 'Heuballen', rare: false },
    scarecrow: { name: 'Vogelscheuche', rare: true }, beehive: { name: 'Bienenstock', rare: true }, well: { name: 'Brunnen', rare: true },
    chicken: { name: 'Huhn', rare: true, animal: true }, duck: { name: 'Ente', rare: true, animal: true }
  };
  const WEATHER = ['sonnig', 'heiter', 'bewoelkt', 'regen', 'gewitter'];

  /* ---------- Datum (nur Tagesschlüssel) ---------- */
  const pad = n => String(n).padStart(2, '0');
  const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
  const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
  const weekday = k => parseKey(k).getDay();                 // 0 = Sonntag
  const weekStart = k => addDays(k, -((weekday(k) + 6) % 7)); // Montag
  const seasonOf = m => (m >= 2 && m <= 4 ? 'Frühling' : m >= 5 && m <= 7 ? 'Sommer' : m >= 8 && m <= 10 ? 'Herbst' : 'Winter');

  /* ---------- Zufall (deterministisch, injizierbar) ---------- */
  const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  /* ---------- XP & Level (4.1) ---------- */
  const xpFor = (effort, status) => (status === 'done' ? 10 * effort : status === 'tiny' ? 5 * effort : 0);
  const charNeed = L => Math.round(100 * Math.pow(L, 1.5));
  const skillNeed = L => Math.round(50 * Math.pow(L, 1.5));
  function lvl(total, need) { let l = 1; while (total >= need(l)) { total -= need(l); l++; } return { l, into: total, need: need(l) }; }
  const unitsToNext = (level, effort) => Math.max(1, Math.ceil((level.need - level.into) / (10 * effort)));
  const stageOf = s => STAGES.findIndex(([t]) => s < t);
  const ema = (s, x) => s * (1 - C.EMA_A) + C.EMA_A * x;

  /* ---------- Gewohnheit: Einstellungen über die Zeit ----------
   * Aufwand und Frequenz können bearbeitet werden. Damit alte Termine nicht rückwirkend
   * anders zählen, speichert history die Einstellungen ab einem Datum.
   */
  function settingsAt(h, k) {
    let cur = h.history[0];
    for (const e of h.history) { if (e.from <= k) cur = e; else break; }
    return cur;
  }
  const isPaused = (h, k) => (h.pauses || []).some(p => p.from <= k && (!p.to || k < p.to));
  function isScheduled(h, k) {
    if (k < h.createdAt || isPaused(h, k)) return false;
    const f = settingsAt(h, k).frequency;
    return f.kind !== 'weekdays' || f.days.includes(weekday(k));
  }
  const isDoneStatus = st => st === 'done' || st === 'tiny';

  /* ---------- Kernberechnung pro Gewohnheit ----------
   * Die Logs sind die einzige Quelle der Wahrheit. Stärke, Serie, Regentage, XP und Kalender
   * werden daraus abgeleitet (statt gespeichert), damit Rückgängig und Bearbeiten nie inkonsistent werden.
   */
  function computeHabit(h, today) {
    const ym = today.slice(0, 7), y = today.slice(0, 4), mStart = ym + '-01';
    const logs = h.logs || {};
    let s = 0, sMonth = null, streak = 0, run = 0, tokens = 0, prog = 0, xp = 0;
    let month = 0, monthTiny = 0, year = 0, lastPrev = null, lastPrevKey = null, doneToday = null;
    const xpByDay = {}, days = {};
    // Wochen-Gewohnheiten
    let wk = null, wcnt = 0, wStreak = 0, wN = 0;
    const finishWeek = () => {
      if (wk === null) return;
      let active = 0;
      for (let i = 0; i < 7; i++) { const d = addDays(wk, i); if (d >= h.createdAt && !isPaused(h, d)) active++; }
      const target = Math.min(wN, Math.ceil(wN * active / 7));     // A11: anteilig in angebrochenen Wochen
      for (let i = Math.min(wcnt, target); i < target; i++) s = ema(s, 0);
      if (target > 0) wStreak = wcnt >= target ? wStreak + 1 : 0;
    };
    for (let k = h.createdAt; k <= today; k = addDays(k, 1)) {
      const st = logs[k], isT = k === today, set = settingsAt(h, k), f = set.frequency;
      if (k === mStart && sMonth === null) sMonth = s;
      if (isT) doneToday = st || null;
      if (f.kind === 'weekly') {
        const w = weekStart(k);
        if (w !== wk) { finishWeek(); wk = w; wcnt = 0; wN = settingsAt(h, w < h.createdAt ? h.createdAt : w).frequency.timesPerWeek; }
        if (isPaused(h, k)) continue;
        if (isDoneStatus(st) && wcnt < wN) {                       // A5: XP nur für geplante Termine
          wcnt++; s = ema(s, 1);
          const x = xpFor(set.effort, st); xp += x; xpByDay[k] = x; days[k] = st;
          if (k.startsWith(y)) year++; if (k.startsWith(ym)) { month++; if (st === 'tiny') monthTiny++; }
        }
        continue;
      }
      if (!isScheduled(h, k)) { if (!isPaused(h, k)) days[k] = 'off'; continue; }
      if (isDoneStatus(st)) {
        s = ema(s, 1); streak++; run++;
        if (++prog >= C.TOKEN_EVERY) { prog = 0; tokens = Math.min(C.MAX_TOKENS, tokens + 1); }
        const x = xpFor(set.effort, st); xp += x; xpByDay[k] = x; days[k] = st;
        if (k.startsWith(y)) year++; if (k.startsWith(ym)) { month++; if (st === 'tiny') monthTiny++; }
        if (!isT) { lastPrev = st; lastPrevKey = k; }
      } else if (st === 'repaired') {
        s = ema(s, 1); streak++; run = 0; days[k] = 'repaired'; lastPrev = st; lastPrevKey = k;
      } else if (!isT) {
        if (h.streakEnabled && tokens > 0) { tokens--; s = ema(s, 1); run = 0; days[k] = 'watered'; lastPrev = 'watered'; }
        else { s = ema(s, 0); streak = 0; run = 0; days[k] = 'missed'; lastPrev = 'missed'; }
        lastPrevKey = k;
      }
    }
    const freqNow = settingsAt(h, today).frequency, weekly = freqNow.kind === 'weekly';
    const N = weekly ? freqNow.timesPerWeek : 0, weekCnt = weekly ? (wk === weekStart(today) ? wcnt : 0) : 0;
    if (weekly) streak = wStreak + (weekCnt >= N ? 1 : 0);
    if (sMonth === null) sMonth = 0;
    const paused = isPaused(h, today);
    const due = !paused && (weekly ? (weekCnt < N || !!doneToday) : isScheduled(h, today));
    const graduated = !h.remindersEnabled && !!h.remOffAt && daysBetween(h.remOffAt, today) >= C.GRAD_DAYS && s >= C.SUGGEST_STRENGTH;
    const canRepair = h.streakEnabled && !weekly && lastPrev === 'missed' && !!lastPrevKey &&
      daysBetween(lastPrevKey, today) <= C.REPAIR_DAYS && isDoneStatus(doneToday);
    return {
      s, stage: stageOf(s), stageMonthStart: stageOf(sMonth), streak, run, tokens, xp, xpByDay, days,
      month, monthTiny, year, doneToday, weekCnt, N, weekly, due, paused, graduated,
      gradDate: graduated ? addDays(h.remOffAt, C.GRAD_DAYS) : null,
      canRepair, repairKey: canRepair ? lastPrevKey : null,
      suggestOff: h.remindersEnabled && !paused && s >= C.SUGGEST_STRENGTH && run >= C.SUGGEST_RUN,
      age: daysBetween(h.createdAt, today) + 1
    };
  }

  /* ---------- Gesamtzustand ableiten ---------- */
  function derive(state, today) {
    const H = {}; state.habits.forEach(h => { H[h.id] = computeHabit(h, today); });
    const sk = {}, byDay = {};
    state.skills.forEach(s => { sk[s.id] = 0; byDay[s.id] = {}; });
    state.habits.forEach(h => {
      if (sk[h.skillId] === undefined) return;
      sk[h.skillId] += H[h.id].xp;
      const b = byDay[h.skillId]; for (const k in H[h.id].xpByDay) b[k] = (b[k] || 0) + H[h.id].xpByDay[k];
    });
    state.todos.forEach(t => {
      if (!t.doneAt || sk[t.skillId] === undefined) return;
      const x = 10 * t.effort; sk[t.skillId] += x; byDay[t.skillId][t.doneAt] = (byDay[t.skillId][t.doneAt] || 0) + x;
    });
    const total = Object.values(sk).reduce((a, b) => a + b, 0) + state.journal.length * C.JOURNAL_XP;
    const levels = {}; state.skills.forEach(s => { levels[s.id] = lvl(sk[s.id], skillNeed); });
    return { H, sk, byDay, levels, total, char: lvl(total, charNeed) };
  }

  /* ---------- Funde (4.4) ---------- */
  function pickItem(rand, rare) { const pool = Object.keys(ITEMS).filter(k => ITEMS[k].rare === rare); return pool[Math.floor(rand() * pool.length)]; }
  function rollDrop(rand) { if (rand() >= C.DROP_P) return null; return pickItem(rand, rand() < C.RARE_P); }
  /** B2: neue Wachstumsstufe = garantierter Fund. Hochwassermarke verhindert Mehrfach-Ernte nach Rückgängig. */
  const harvestsDue = (h, d) => Math.max(0, d.stage - (h.harvestStage || 0));
  const gradRewardDue = (h, d) => d.graduated && !h.gradRewarded;
  const slotsFor = L => Math.min(12, 3 + L);

  /* ---------- Onboarding (5.1) ---------- */
  function canAddHabit(state, today) {
    const active = state.habits.filter(h => !h.archivedAt).length;
    if (active < C.START_HABITS) return { ok: true };
    const since = state.startedAt ? daysBetween(state.startedAt, today) : 0;
    if (since >= C.UNLOCK_DAYS) return { ok: true };
    return { ok: false, unlockOn: addDays(state.startedAt || today, C.UNLOCK_DAYS) };
  }
  function validateHabitInput(i) {
    const miss = [];
    if (!i.title || !i.title.trim()) miss.push('was du tun möchtest');
    if (!i.anchor || !i.anchor.trim()) miss.push('nach welcher Routine');
    if (!i.tinyVersion || !i.tinyVersion.trim()) miss.push('eine Mini-Version');
    if (i.frequency && i.frequency.kind === 'weekdays' && !(i.frequency.days || []).length) miss.push('mindestens einen Wochentag');
    if (i.frequency && i.frequency.kind === 'weekly' && !(i.frequency.timesPerWeek >= 1 && i.frequency.timesPerWeek <= 6)) miss.push('1 bis 6 Mal pro Woche');
    if (![1, 2, 3].includes(i.effort)) miss.push('einen Aufwand');
    return miss;
  }
  const cleanAnchor = a => String(a || '').trim().replace(/^nach\s+/i, '');
  function newHabit(i, today, id) {
    return {
      id, title: i.title.trim(), anchor: cleanAnchor(i.anchor), anchorTime: i.anchorTime || '', tinyVersion: i.tinyVersion.trim(),
      frequency: i.frequency, skillId: i.skillId, effort: i.effort, streakEnabled: !!i.streakEnabled, remindersEnabled: !!i.remindersEnabled,
      remOffAt: i.remindersEnabled ? null : today, createdAt: today, history: [{ from: today, effort: i.effort, frequency: i.frequency }],
      pauses: [], logs: {}, harvestStage: 0, gradRewarded: false, rolled: ''
    };
  }
  /** F7: Bearbeiten. Aufwand/Frequenz gelten ab heute, ältere Termine behalten ihre Werte. */
  function applyEdit(h, i, today) {
    const changedSched = h.effort !== i.effort || JSON.stringify(h.frequency) !== JSON.stringify(i.frequency);
    h.title = i.title.trim(); h.anchor = cleanAnchor(i.anchor); h.anchorTime = i.anchorTime || ''; h.tinyVersion = i.tinyVersion.trim(); h.skillId = i.skillId;
    if (h.streakEnabled !== !!i.streakEnabled) h.streakEnabled = !!i.streakEnabled;
    if (h.remindersEnabled !== !!i.remindersEnabled) { h.remindersEnabled = !!i.remindersEnabled; h.remOffAt = h.remindersEnabled ? null : today; }
    if (changedSched) {
      h.effort = i.effort; h.frequency = i.frequency;
      const last = h.history[h.history.length - 1];
      if (last.from === today) { last.effort = i.effort; last.frequency = i.frequency; }
      else h.history.push({ from: today, effort: i.effort, frequency: i.frequency });
    }
    return h;
  }
  function pause(h, today) { if (h.archivedAt) return h; h.archivedAt = today; (h.pauses = h.pauses || []).push({ from: today, to: null }); return h; }
  function resume(h, today) {
    const p = (h.pauses || []).find(x => !x.to); if (p) { if (p.from === today) h.pauses.splice(h.pauses.indexOf(p), 1); else p.to = today; }

(async function (root) {
  'use strict';
  const L = root.LAG, today = L.dkey(new Date());
  let state = null;
  try {
    const saved = await root.LAGStore.load();
    if (saved) { const r = L.importState(saved, today); if (r.ok) state = r.state; }
  } catch (e) { state = null; }
  root.LAGUI.boot(state);

  // H5: offline-fähig und installierbar. Nur mit Manifest (nicht in der Artifact-Vorschau) und sicherem Kontext.
  const hasManifest = !!document.querySelector('link[rel="manifest"]');
  if (hasManifest && 'serviceWorker' in navigator && root.isSecureContext) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* z. B. file:// – App läuft trotzdem */ });
  }
})(typeof self !== 'undefined' ? self : this);

</script>

</body></html>
